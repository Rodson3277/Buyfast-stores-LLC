<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#004D40"/>
      <stop offset="50%" stop-color="#00897B"/>
      <stop offset="100%" stop-color="#26A69A"/>
    </linearGradient>
    <linearGradient id="arrow1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#B2DFDB" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="arrow2" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#B2DFDB" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#004D40" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Inner subtle ring -->
  <circle cx="60" cy="60" r="50" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" fill="none"/>

  <!-- Top arrow: left to right (send) -->
  <path d="M28 46 Q60 34 88 46" stroke="url(#arrow1)" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <polygon points="88,40 96,46 88,52" fill="white" opacity="0.95"/>

  <!-- Bottom arrow: right to left (receive) -->
  <path d="M92 74 Q60 86 32 74" stroke="url(#arrow2)" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <polygon points="32,68 24,74 32,80" fill="white" opacity="0.95"/>

  <!-- Center dollar/exchange badge -->
  <circle cx="60" cy="60" r="16" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <text x="60" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="white" opacity="0.97">$</text>
</svg>
